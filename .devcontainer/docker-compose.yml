services:
  app:
    image: mcr.microsoft.com/devcontainers/typescript-node:24-bookworm
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    network_mode: service:db
    environment:
      DATABASE_URL: postgresql://locacao:locacao_dev@localhost:5432/locacao_dev?schema=public

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: locacao
      POSTGRES_PASSWORD: locacao_dev
      POSTGRES_DB: locacao_dev
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
